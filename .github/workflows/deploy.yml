# ============================================================
# Build the static export and upload it to Hostinger over FTP.
#
# Runs on every push to main, and can be triggered by hand from the
# Actions tab (Run workflow).
#
# REQUIRED REPOSITORY SECRETS
#   Settings > Secrets and variables > Actions > New repository secret
#
#   NEXT_PUBLIC_SUPABASE_URL       same value as in .env.local
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  same value as in .env.local
#   FTP_SERVER                     e.g. ftp.aynlegalaid.com  (hPanel > Files > FTP Accounts)
#   FTP_USERNAME                   e.g. u419952466.aynlegalaid.com
#   FTP_PASSWORD                   the FTP account password
#
# The two NEXT_PUBLIC_* values are baked into the browser bundle at build
# time. Without them the deployed site builds "unconfigured" and both auth
# and chat silently stop working — that is why the guard step below fails
# loudly rather than shipping a broken site.
#
# NOTE: Hostinger serves through a CDN. After a deploy, purge the cache in
# hPanel (Websites > aynlegalaid.com > Performance) or old pages keep serving.
# ============================================================

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same server.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Fail early if any secret is missing
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]  && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$SUPABASE_ANON" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$FTP_SERVER" ]    && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ]  && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ]  && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Stamp the build so the deploy can be verified
        run: echo "$GITHUB_SHA" > out/build-id.txt

      - name: Sanity-check the build output
        run: |
          test -f out/index.html  || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html    || { echo "::error::out/404.html missing"; exit 1; }
          test -f out/.htaccess   || { echo "::error::out/.htaccess missing — security headers would be lost"; exit 1; }
          # The bundle must never contain a Groq key or the service_role key.
          if grep -rqE "gsk_[A-Za-z0-9]|service_role" out/; then
            echo "::error::A secret was found in the build output. Deploy aborted."
            exit 1
          fi
          echo "Build output looks good ($(find out -type f | wc -l) files)."

      # lftp instead of SamKirkland/FTP-Deploy-Action: that action failed with
      # "550 /_next/<buildid>: No such file or directory" because it could not
      # create this build's 111 nested directories on Hostinger's FTP server.
      # lftp's mirror handles directory creation properly, and pwd/ls print the
      # real login directory — which is what makes a wrong upload target
      # obvious in the log instead of silent.
      - name: Upload to Hostinger over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:max-retries 3
          set net:timeout 20
          echo "--- login directory ---"
          pwd
          echo "--- what is already here ---"
          ls
          echo "--- uploading ---"
          mirror -R --verbose=1 --parallel=4 --exclude-glob .well-known/ ./out/ ./
          echo "--- after upload ---"
          ls
          bye
          LFTP

      # Uploading to the wrong server-dir still reports success, so confirm the
      # live site is actually serving THIS commit before calling it a deploy.
      - name: Verify the live site is serving this build
        run: |
          sleep 10
          live=$(curl -sS --max-time 30 "https://aynlegalaid.com/build-id.txt?cb=$GITHUB_RUN_ID" | tr -d '[:space:]')
          echo "expected: $GITHUB_SHA"
          echo "live:     $live"
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::The live site is NOT serving this build."
            echo "Most likely server-dir points at the wrong folder, or the CDN is caching."
            echo "Check the document root in hPanel and the server-dir value in this workflow."
            exit 1
          fi
          echo "Confirmed: aynlegalaid.com is serving $GITHUB_SHA"

      - name: Done
        run: echo "Deployed and verified. Purge the Hostinger CDN cache if pages still look stale."
